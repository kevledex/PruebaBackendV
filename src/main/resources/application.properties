spring.application.name=AplicativoWeb
server.port = 8080

spring.datasource.url=jdbc:postgresql://localhost:5432/vinculacion
spring.datasource.username=postgres
spring.datasource.password=PostgreS1367

# -Indica al controlador que permite la conexion entre Java y PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# -Traduce las consultas JPA de Java a la sintaxis de PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -El update actualiza automáticamente la estructura de la base de datos
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -Evita el error de serialización
spring.jackson.serialization.fail-on-empty-beans=false

# -Evita que Jackson use el constructor "todos los argumentos" de Lombok
# (que Lombok expone via @ConstructorProperties) y falle al recibir objetos
# parciales como {"id": 5} para relaciones @ManyToOne: al faltar los campos
# booleanos/primitivos en el JSON, Jackson intentaba pasarles null.
spring.jackson.deserialization.fail-on-null-for-primitives=false